# FastAPI 后端服务
upstream fastapi_backend {
    server 127.0.0.1:8000;
}

# Cloudflare Worker 转发请求到此服务器的 9100 端口
# Worker 配置：/w-game-service/* -> http://elvis1949.top:9100/*
#
# 三层防护机制：
# 1. Nginx IP 白名单 - 只允许 Cloudflare IP 访问
# 2. Cloudflare 请求头验证 - 验证 CF-Connecting-IP 和 CF-RAY
# 3. FastAPI 签名验证 - 验证 HMAC-SHA256 签名和时间戳

server {
    listen 9100;  # 将被 deploy.sh 替换为用户指定的端口
    server_name your-backend-domain.com;

    # ===== Cloudflare IP 白名单（第一层防护） =====
    # 仅允许 Cloudflare IPv4 访问
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;

    # Cloudflare IPv6
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;

    # 拒绝所有其他 IP（包括直接访问源 IP 的请求）
    deny all;

    # ===== API 路由 =====
    location /api/ {
        # 验证必须的 Cloudflare 请求头（第二层防护）
        if ($http_cf_connecting_ip = "") {
            return 403 "Missing CF-Connecting-IP header";
        }

        if ($http_cf_ray = "") {
            return 403 "Missing CF-RAY header";
        }

        # 传递真实客户端 IP
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;

        # 传递 Cloudflare 请求头到 FastAPI（第三层防护会验证）
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-RAY $http_cf_ray;

        # 转发到 FastAPI
        proxy_pass http://fastapi_backend;
        proxy_redirect off;

        # 超时设置
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ===== 健康检查（允许本地访问） =====
    location /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://fastapi_backend;
        access_log off;
    }

    # 日志
    access_log /var/log/nginx/word-validator-access.log;
    error_log /var/log/nginx/word-validator-error.log warn;
}
